<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Для тебя ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;font-family:Georgia,serif;background:radial-gradient(circle at 50% 35%,#fff 0,#ff6f9b 38%,#8b1248 100%);color:#200f0f;}
#password{background-color:#f5b3c7}
.note{font-size:13px;opacity:.55;text-align:center;margin-top:18px}
input::placeholder{color:#000!important;opacity:1!important}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .8s,transform .8s;padding:15px}
.hidden{opacity:0;pointer-events:none;transform:scale(.96)}
.card{text-align:center;padding:30px 20px;width:min(100%,520px)}
h1{font-size:clamp(24px,6vw,34px);margin:0 0 14px}
p{font-size:clamp(16px,4.5vw,19px);line-height:1.55;margin:10px 0}
.hint{font-size:clamp(15px,4vw,17px);opacity:.8;margin-bottom:24px}
input{width:100%;max-width:330px;padding:15px 18px;border:2px solid #7b123f;border-radius:30px;outline:0;background:#f3f3f3;text-align:center;font-size:18px;color:#000;transition:all .3s;-webkit-appearance:none}
input:focus{border-color:#ff477e;box-shadow:0 0 15px rgba(255,71,126,.6);background:#fff}
button{margin-top:14px;padding:13px 35px;border:0;border-radius:28px;background:#8b1248;color:#fff;font-size:17px;cursor:pointer;box-shadow:0 8px 22px #3d001c88;transition:.2s;-webkit-tap-highlight-color:transparent}
button:hover{transform:translateY(-2px);background:#a31a57}
#sad{height:28px;margin-top:15px;font-size:25px;opacity:0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.heart{position:fixed;opacity:.45;animation:float 6s linear infinite;user-select:none;pointer-events:none}
@keyframes float{0%{transform:translateY(105vh) translateX(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-15vh) translateX(20px) rotate(360deg);opacity:0}}
.envelope-wrap{text-align:center;width:100%;max-width:320px;padding:0 10px}
.envelope{position:relative;width:100%;max-width:300px;aspect-ratio:300/195;margin:auto;cursor:pointer;filter:drop-shadow(0 18px 18px #71394c40);transition:transform .2s}
.envelope:hover{transform:translateY(-5px)}
.env-body{position:absolute;inset:0;background:#fff;border-radius:5px;overflow:hidden}
.env-body:before,.env-body:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.env-body:before{left:0;border-width:0 150px 105px 0;border-color:transparent #f1ccd7 transparent transparent}
.env-body:after{right:0;border-width:105px 0 0 150px;border-color:transparent transparent transparent #f1ccd7}
.flap{position:absolute;z-index:3;top:0;left:0;width:0;height:0;border-left:150px solid transparent;border-right:150px solid transparent;border-top:105px solid #ff477e;transform-origin:top;transition:.5s}
.seal{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:45px;height:45px;border-radius:50%;background:#8b1248;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(139,18,72,.7)}70%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 10px rgba(139,18,72,0)}100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 0 0 rgba(139,18,72,0)}}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.break{animation:break .8s forwards}
@keyframes break{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(.96) rotate(3deg)}100%{transform:scale(0) rotate(12deg);opacity:0}}
.piece{position:fixed;width:10px;height:7px;background:#fff;z-index:20;animation:piece 1.1s ease-out forwards;pointer-events:none}
@keyframes piece{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#letter{z-index:2}
.paper{position:relative;width:min(100%,720px);max-height:85vh;overflow-y:auto;padding:clamp(20px,6vw,45px) clamp(20px,6vw,45px) 30px;background:#fffdf8;border-radius:5px;box-shadow:0 25px 60px #64374455;transform:translateY(50px) scale(.7);opacity:0;transition:1s}
.paper.show{transform:none;opacity:1}
.paper h2{text-align:center;font-size:clamp(22px,5.5vw,31px);margin:0 0 20px}
.message{font-family:"Segoe Print",cursive;font-size:clamp(16px,4.2vw,20px);line-height:1.7;white-space:pre-line}
.message::after{content:"✏️";font-size:16px;margin-left:3px;animation:blink .8s infinite}
.message.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.photo{display:none;margin:25px auto 10px;width:100%;max-width:280px;height:auto;aspect-ratio:1/1;border-radius:12px;box-shadow:0 8px 25px #0002;object-fit:cover;opacity:0;transition:opacity 1.5s ease}
.photo.show-img{display:block;opacity:1}
.signature{text-align:right;font-family:"Segoe Print",cursive;font-size:clamp(16px,4.2vw,19px);margin-top:20px;opacity:0;transition:opacity 1s ease}
.signature.show-sig{opacity:1}
@media (max-width:360px){.envelope-wrap{max-width:260px}.env-body:before{border-width:0 130px 91px 0}.env-body:after{border-width:91px 0 0 130px}.flap{border-left-width:130px;border-right-width:130px;border-top-width:91px}}
</style>
</head>
<body>

<div class="heart" style="left:10%;animation-delay:0s">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s">💕</div>
<div class="heart" style="left:70%;animation-delay:1.5s">💗</div>
<div class="heart" style="left:90%;animation-delay:3s">❤️</div>

<section id="login" class="screen">
  <div class="card">
    <h1>Для одной особенной девочки ❤️</h1>
    <p>Но сначала я должен убедиться,<br>что это действительно ты…</p>
    <div class="hint">Как я тебя часто называю? 🥰</div>
    <input id="password" autocomplete="off" placeholder="Твой ответ...">
    <br><button id="button" onclick="check()">Продолжить</button>
    <div id="sad">🥺</div>
  </div>
</section>

<section id="envelopeScreen" class="screen hidden">
  <div class="envelope-wrap">
    <p style="font-size:20px;margin-bottom:25px">У меня для тебя кое-что есть 💌</p>
    <div id="envelope" class="envelope" onclick="openEnvelope()">
      <div class="env-body"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <p style="font-size:15px;opacity:.65">Нажми на конверт</p>
  </div>
</section>

<section id="letter" class="screen hidden">
  <div id="paper" class="paper">
    <h2>Для моей зайки ❤️</h2>
    <div id="textMessage" class="message"></div>
    <img id="girlPhoto" class="photo" src="portrait.jpg" alt="Твоя фотография">
    <div id="letterSignature" class="signature">Твой ❤️</div>
    <div class="note">P.S. А пароль ты угадала слишком легко 😌</div>
  </div>
</section>

<script>
const textToType = `Привет, моя любимая ❤️\n\nЯ сделал для тебя эту штуку, чтобы подарить то, что сделано именно для тебя.\n\nСпасибо за то, что ты есть в моей жизни. Мне очень нравится проводить с тобой время, разговаривать и смеяться.\n\nЯ очень тебя люблю и хочу, чтобы ты всегда помнила: ты для меня особенная. ❤️\n\nНадеюсь, эта неожиданность заставит тебя улыбнуться. 🥰`;
let photoValid = false;
const imgCheck = new Image();
imgCheck.src = "portrait.jpg";
imgCheck.onload = function() { photoValid = true; };
imgCheck.onerror = function() { photoValid = false; };

function check(){
  const input=document.getElementById("password");
  const sad=document.getElementById("sad");
  if(input.value.trim().toLowerCase()==="зайка" || input.value.trim().toLowerCase()==="зайку"){
    document.getElementById("login").classList.add("hidden");
    setTimeout(()=>document.getElementById("envelopeScreen").classList.remove("hidden"),450);
  }else{
    sad.style.opacity="1";
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
    setTimeout(()=>sad.style.opacity="0",1000);
  }
}
document.getElementById("password").addEventListener("keydown",e=>{ if(e.key==="Enter") check(); });

function openEnvelope(){
  const env=document.getElementById("envelope");
  if(env.classList.contains("break")) return;
  env.classList.add("open");
  setTimeout(()=>{
    const r=env.getBoundingClientRect();
    for(let i=0;i<30;i++){
      const p=document.createElement("div"); p.className="piece";
      p.style.left=(r.left+r.width/2)+"px"; p.style.top=(r.top+r.height/2)+"px";
      p.style.setProperty("--x",(Math.random()*400-200)+"px"); p.style.setProperty("--y",(Math.random()*400-200)+"px"); p.style.setProperty("--r",(Math.random()*720-360)+"deg");
      document.body.appendChild(p); setTimeout(()=>p.remove(),1200);
    }
    env.classList.add("break");
  },450);
  setTimeout(()=>{
    document.getElementById("envelopeScreen").classList.add("hidden");
    document.getElementById("letter").classList.remove("hidden");
    setTimeout(()=>{ document.getElementById("paper").classList.add("show"); setTimeout(startTyping, 600); },80);
  },1350);
}

function startTyping() {
  const container = document.getElementById("textMessage");
  let index = 0;
  function type() {
    if (index < textToType.length) {
      container.innerHTML += textToType[index] === '\n' ? '<br>' : textToType[index];
      index++; setTimeout(type, 45);
    } else {
      container.classList.add("done");
      if (photoValid) document.getElementById("girlPhoto").classList.add("show-img");
      document.getElementById("letterSignature").classList.add("show-sig");
    }
  }
  type();
}
</script>
</body>
</html>
